name: Friends
options:
  bundleIdPrefix: cl.toolazy
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # La app esta escrita en espanol de punta a punta. Sin esto el bundle se
    # declara en ingles y el sistema la trata como si tuviera traduccion.
    DEVELOPMENT_LANGUAGE: es
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: JXP8Q6BRU2

targets:
  Friends:
    type: application
    platform: iOS
    sources:
      - path: Friends
    settings:
      configs:
        Debug:
          # Sin cuenta de Apple Developer no hay passkeys, asi que en Debug se
          # trabaja contra el Rails local con el atajo /auth/dev_session.
          API_BASE_URL: http://localhost:3000
        Release:
          API_BASE_URL: https://friends-api.toolazy.cl
          CODE_SIGN_ENTITLEMENTS: Friends/Friends.Release.entitlements
      base:
        # Sin esto, Color.accentColor cae en el azul del sistema y el tinte de
        # marca no llega ni a la barra de pestanas ni a los controles estandar.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: cl.toolazy.friends
        PRODUCT_NAME: Friends
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"     # solo iPhone
        # Las entitlements van por configuracion: `aps-environment` tiene que
        # decir "production" en la build que se sube, o los avisos no llegan a
        # nadie fuera de Xcode.
        CODE_SIGN_ENTITLEMENTS: Friends/Friends.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Friends/Info.plist
    info:
      # OJO: xcodegen REESCRIBE Friends/Info.plist desde aqui en cada
      # `xcodegen generate`. Editarlo a mano no sirve de nada.
      path: Friends/Info.plist
      properties:
        # Sin esto xcodegen escribe "1.0" fijo, y subir la version arriba no
        # llegaba al build que se manda a App Store Connect.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # El launch screen debe llevar el color de marca: por defecto es blanco,
        # y durante el arranque la app parece rota.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Usamos tu ubicacion para mostrarte personas cerca de ti. Nunca compartimos tus coordenadas exactas con nadie."
        NSCameraUsageDescription: "Para que puedas tomarte una foto de perfil."
        NSPhotoLibraryUsageDescription: "Para que elijas las fotos de tu perfil."
        APIBaseURL: "$(API_BASE_URL)"
        # Permite HTTP contra localhost en desarrollo. No abre trafico HTTP
        # arbitrario a internet: solo red local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  FriendsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FriendsTests
    dependencies:
      - target: Friends
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cl.toolazy.friends.tests
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Friends.app/Friends"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FriendsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FriendsUITests
    dependencies:
      - target: Friends
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cl.toolazy.friends.uitests
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: Friends

schemes:
  Friends:
    build:
      targets:
        Friends: all
    run:
      # Compras de prueba locales: no hace falta cuenta de Apple Developer.
      storeKitConfiguration: Friends.storekit
    test:
      config: Debug
      targets:
        - FriendsTests
        - FriendsUITests
